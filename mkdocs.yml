site_name: MLIA PyTorch Converter
site_description: Documentation for the MLIA PyTorch converter plugin.
site_url: https://arm.github.io/mlia-converters-pytorch/
repo_url: https://github.com/arm/mlia-converters-pytorch
repo_name: arm/mlia-converters-pytorch
edit_uri: edit/main/docs/source/
docs_dir: docs/source
site_dir: .mkdocs/site
strict: true

exclude_docs: |
  /landing-page/

hooks:
  - docs/scripts/landing.py

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Documentation: documentation.md
  - Usage and Integration: usage.md
  - Conversion Flow: conversion_flow.md
  - Conversion Outputs and Diagnostics: conversion_outputs.md
  - CLI: cli.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
