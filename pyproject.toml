[build-system]
requires = [
    "mlia>=0.13.2.dev9,<0.14.0",
    "hatchling==1.32.0",
    "uv-dynamic-versioning==0.14.1"
]
build-backend = "hatchling.build"

[project]
name = "mlia-converters-pytorch"
dynamic = ["version", "readme"]
description = "ML Inference Advisor PyTorch conversion and shared ExecuTorch artifact processing"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [
    {name = "Arm Ltd", email = "mlia@arm.com"}
]
keywords = ["ml", "arm", "pytorch", "tosa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = ["mlia>=0.13.2.dev9,<0.14.0"]

[project.urls]
Homepage = "https://github.com/arm/mlia-converters-pytorch.git"

[project.entry-points."mlia.plugin.transformer"]
pt2_to_tosa = "mlia.backend.mlia_pytorch_to_tosa_converter.converter_plugin:PT2ToTosaConverterPlugin"
nn_module_to_pt2 = "mlia.backend.mlia_nn_module_to_pt2_exporter.exporter_plugin:NNModuleToPt2ExporterPlugin"
pt2_to_pte = "mlia.backend.mlia_pytorch_to_pte_converter.converter_plugin:PT2ToPteConverterPlugin"
pte_to_delegate = "mlia.backend.mlia_pte_to_delegate_converter.converter_plugin:PteToDelegateConverterPlugin"

[tool.uv]
# Editable wheels contain generated runtime bundles. Track their authored inputs,
# excluding build/ and runtime/inputs so preparation does not invalidate itself.
cache-keys = [
    {file = "pyproject.toml"},
    {file = "hatch_build.py"},
    {file = "runtime/*.py"},
    {file = "runtime/*.json"},
    {file = "runtime/*/pyproject.toml"},
    {file = "src/mlia/**/*.py"},
    {file = "src/mlia/resources/**/*"},
    {file = "LICENSES/*.txt"},
    {file = "src/mlia/_vendor/**/.sha256*"},
    {file = "src/mlia/_vendor/**/*.toml"},
    {file = "src/mlia/_vendor/**/license_terms/**/*.txt"},
    {git = {commit = true, tags = true}}
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "runtime/hatch_runtime.py"

[tool.hatch.build.targets.wheel]
# Include implicit namespace packages under src/.
only-include = ["src/mlia"]
sources = ["src"]
exclude = ["src/mlia/**/worker.py", "src/mlia/resources/runtimes/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mlia/**",
    "runtime/**",
    "LICENSES/*.txt",
    "README.md",
    "pyproject.toml"
]
exclude = ["src/mlia/resources/runtimes/**"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
fallback-version = "0.0.0.dev0"

[tool.pytest.ini_options]
addopts = ["--ignore=tests/e2e"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.blocklint]
max_issue_threshold = 1
blocklist = ["master", "slave", "blacklist", "whitelist", "dummy"]
wordlist = ["he", "she", "him", "her", "his", "hers"]
skip_files = ["LICENSES/Apache-2.0.txt", "docs/source/conf.py", "pyproject.toml"]

[tool.mypy]
# Suppress errors for optional dependencies and cross-repo imports.
ignore_missing_imports = true
explicit_package_bases = true

# Worker code is exercised by installed-runtime E2E tests, outside frontend coverage.
[tool.coverage.run]
omit = ["*/worker.py"]

[dependency-groups]
worker = [
    "torch==2.14.0",
    "executorch==1.5.1",
    "torchao==0.18.0",
    "ethos-u-vela==5.2.0",
    "tosa-tools==2026.2.1",
    "ml-dtypes==0.5.1"
]
test = [
    {include-group = "worker"},
    "hatchling==1.32.0",
    "pytest==9.1.1",
    "flaky==3.8.1",
    "pytest-cov==7.1.0"
]
dev = [
    {include-group = "test"},
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "blocklint==0.3.0",
    "build==1.6.1",
    "tomli==2.4.1; python_version<'3.11'"
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.2"
]
