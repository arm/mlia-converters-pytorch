name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

  # Separate uv installations from each other on self-hosten runners
  # in case they share the working directory
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_DIR: ${{ github.workspace }}/.uv-tools-ci-${{ github.run_id }}-${{ github.run_attempt }}
  UV_TOOL_BIN_DIR: ${{ github.workspace }}/.uv-bin-ci-${{ github.run_id }}-${{ github.run_attempt }}

  VAULT_COMMON_CI_SECRETS: &vault-common-ci-secrets |
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD ;
    kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} VENDORED_ARTIFACTS_URLS | VENDORED_ARTIFACTS_URLS

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  blackduck_scan:
    name: Black Duck Scan
    if: ${{ github.event.repository.private && github.ref_type == 'tag' }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/blackduck-full-scan.yml@f043921e498ad33aca180f2d2e41c7ae10fbb1cf
    with:
      project-version: ${{ github.ref_name }}
      source-ref: ${{ github.sha }}
      uv-dependencies: true
      python-version: "3.10"
      vault-namespace: iac-expkits/prod
      vault-secrets: |
        kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
        kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
        kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD
    secrets:
      BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
      VAULT_URL: ${{ secrets.VAULT_URL }}
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

  build_and_test_wheel:
    name: Build And Test Wheel
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        # Vault secrets must not be exposed to pull requests from forks.
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - run: uv sync --no-install-project --group test
      - run: uv pip install --python "$UV_PROJECT_ENVIRONMENT" --no-deps dist/*.whl
      - run: uv pip check --python "$UV_PROJECT_ENVIRONMENT"
      - run: |
          set -o pipefail
          uv run --no-sync \
            pytest --no-success-flaky-report -o pythonpath= tests/ | tee coverage.txt
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```text'
            tail -n 20 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - name: Upload tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*
          if-no-files-found: error

  publish_release:
    name: Publish Release
    needs:
      - lint
      - blackduck_scan
      - build_and_test_wheel
    if: >-
      ${{
        !cancelled() &&
        needs.lint.result == 'success' &&
        needs.build_and_test_wheel.result == 'success' &&
        (!github.event.repository.private || github.ref_type != 'tag' ||
          needs.blackduck_scan.result == 'success') &&
        (github.repository_owner != 'arm' || github.ref_type == 'tag')
      }}
    runs-on: ["${{ vars.UBUNTU_RUNNER }}", "X64"]
    steps:
      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: iac-expkits/prod
          secrets: *vault-common-ci-secrets

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: uv publish dist/*
        env:
          UV_PUBLISH_URL: ${{ secrets.PUBLISH_PYPI_HOST }}
          UV_PUBLISH_USERNAME: ${{ secrets.INTERNAL_PYPI_USERNAME || secrets.PUBLISH_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.INTERNAL_PYPI_PASSWORD || secrets.PUBLISH_PYPI_PASSWORD }}

  publish_docs:
    name: Publish Documentation
    if: ${{ github.event.repository.private && github.ref_type == 'tag' }}
    needs: publish_release
    uses: ./.github/workflows/docs.yml
    with:
      publish: true
      wheel-artifact: wheel
    secrets: inherit

  create_github_release:
    name: Prepare Release Notes
    if: ${{ github.event.repository.private && github.ref_type == 'tag' }}
    needs: publish_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release or preserve existing notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                ...repo, tag
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                generate_release_notes: true,
                prerelease: !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)
              });
              return;
            }
            const updates = {};
            if (!release.body?.trim()) {
              const { data: notes } = await github.rest.repos.generateReleaseNotes({
                ...repo, tag_name: tag, target_commitish: context.sha
              });
              updates.body = notes.body;
            }
            if (release.draft) updates.draft = false;
            if (Object.keys(updates).length) {
              await github.rest.repos.updateRelease({
                ...repo, release_id: release.id, ...updates
              });
            }

  sync_to_public_repo:
    needs: publish_release
    if: >-
      ${{ github.event.repository.private && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/sync-to-public-repo.yml@d700621dafc25dea2b4c5d8531171af5ec8e00ee
    with:
      public_repo: arm/mlia-converters-pytorch
    secrets: inherit

  sync_release_to_public_repo:
    needs: create_github_release
    if: >-
      ${{ github.event.repository.private && github.event_name == 'push' &&
      github.ref_type == 'tag' }}
    uses: Arm-Debug/github-workflow-wizardry/.github/workflows/sync-to-public-repo.yml@d700621dafc25dea2b4c5d8531171af5ec8e00ee
    with:
      public_repo: arm/mlia-converters-pytorch
    secrets: inherit
